name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render API
        run: |
          set -e
          curl -fsS --retry 3 --retry-delay 15 --max-time 90 \
            https://kuh-ai-api.onrender.com/health
