                case card && entity === 'companies':

                    v3_widget_entity = 'todo.list';

                        v3_widget_entity = 'contacts.list';

            }

            if (APP.data.current_card) {
                switch (entity) {
                    case 'leads':
                    case 'contacts':

                        v3_widget_entity = entity + '.card';

        function isObject(val) {
            return val && typeof val === 'object' && !Array.isArray(val);
        }

        const deepMerge = (target, source) => {
            for (const key in source) {
                if (Array.isArray(source[key]) && Array.isArray(target[key])) {
                    target[key] = [...target[key], ...source[key]];
                } else if (isObject(source[key]) && isObject(target[key])) {
                    target[key] = deepMerge(target[key], source[key]);
                } else {
                    target[key] = source[key];
                }
            }

            return target;
        };

        APP.constant = function (name, value, options) {
            var i;

            options = options || {};

            if (typeof name === 'object') {
                for (i in name) {
                    this.constant(i, name[i], options);
                }

                return true;
            }

            if (typeof value !== 'undefined') {
                if (typeof value === 'string') {
                    // eslint-disable-next-line no-empty
                    try {
                        value = JSON.parse(value);
                        // eslint-disable-next-line no-empty
                    } catch (e) { }
                }

                if (
                    options.deep &&
                    typeof value === 'object' &&
                    value !== null &&
                    typeof constants[name] === 'object' &&
                    constants[name] !== null
                ) {
                    deepMerge(value, constants[name]);
                }

                constants[name] = value;

                return true;
            }

            return constants[name];
        };

        if ('onvisibilitychange' in document) {

            }
        }

        let customTimes = {};
        let pageType = ''

        APP.metricTracker = {
            set(options) {
                const {
                    type,
                    name,
                    value,
                    group,
                    kind = 'flat',
                } = options;

                const metricsRoot = APP.constant('metricTracker');

                if (!metricsRoot[type]) {
                    metricsRoot[type] = {};
                }

                if (!metricsRoot[type][group]) {
                    metricsRoot[type][group] = {
                        flatMetrics: {},
                        metricSpans: {},
                    };
                }

                const groupNode = metricsRoot[type][group];

                    groupNode.metricSpans = {};

                if (kind === 'span') {
